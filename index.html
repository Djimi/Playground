<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore Sofia neighborhoods on an interactive map." />
    <title>Sofia Neighborhoods</title>
  </head>
  <body>
    <main>
      <header class="map-header">
        <p class="eyebrow">Sofia, Bulgaria</p>
        <h1>Explore neighborhoods</h1>
        <p id="selected-neighborhood" class="selection" aria-live="polite">Select a neighborhood</p>
      </header>
      <div id="map" aria-label="Interactive map of Sofia neighborhoods"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
